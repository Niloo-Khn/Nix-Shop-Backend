services:
  accounts:
    build: .
    environment:
      SERVICE: accounts
      HOST: 0.0.0.0
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:4173}
    ports: ["4001:4001"]
    volumes: ["account-data:/app/data"]
    read_only: true
  products:
    build: .
    environment:
      SERVICE: products
      HOST: 0.0.0.0
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:4173}
    ports: ["4002:4002"]
    read_only: true
  payments:
    build: .
    environment:
      SERVICE: payments
      HOST: 0.0.0.0
      ORDER_SERVICE_URL: http://orders:4005
      SERVICE_API_KEY: ${SERVICE_API_KEY:?Set SERVICE_API_KEY in .env}
      PAYMENT_DATABASE_PATH: /app/data/payments.sqlite
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?Set PAYMENT_WEBHOOK_SECRET in .env}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:4173}
    ports: ["4003:4003"]
    depends_on: [orders]
    volumes: ["payment-data:/app/data"]
    read_only: true
  help:
    build: .
    environment:
      SERVICE: help
      HOST: 0.0.0.0
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:4173}
    ports: ["4004:4004"]
    read_only: true
  orders:
    build: .
    environment:
      SERVICE: orders
      HOST: 0.0.0.0
      PRODUCT_SERVICE_URL: http://products:4002
      PROMOTION_SERVICE_URL: http://promotions:4006
      ACCOUNT_SERVICE_URL: http://accounts:4001
      SERVICE_API_KEY: ${SERVICE_API_KEY:?Set SERVICE_API_KEY in .env}
      ORDER_DATABASE_PATH: /app/data/orders.sqlite
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:4173}
    ports: ["4005:4005"]
    depends_on: [accounts, products, promotions]
    volumes: ["order-data:/app/data"]
    read_only: true
  promotions:
    build: .
    environment:
      SERVICE: promotions
      HOST: 0.0.0.0
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:4173}
    ports: ["4006:4006"]
    read_only: true
  returns:
    build: .
    environment:
      SERVICE: returns
      HOST: 0.0.0.0
      ORDER_SERVICE_URL: http://orders:4005
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:4173}
    ports: ["4007:4007"]
    depends_on: [orders]
    read_only: true

volumes:
  account-data:
  order-data:
  payment-data:
